# Opora Control Center – jediný zdroj nastavení běhu aplikace.
# Spuštění: `uv run opora` (nebo `npm start`). Profil: `uv run opora --profile preview`.
# Lokální přepisy (mimo git): opora.local.toml se stejnou strukturou.

[app]
host = "127.0.0.1"
port = 8740
data = ".data/production"      # adresář s registry.sqlite, projekty a snímky; smí ležet mimo repo
                               # (kratší cesty pro worktree): přesun přes tools/move_data_root.py, cíl v opora.local.toml
open_browser = true            # po startu otevřít http://host:port
title = "Opora Canvas"

[build]
frontend = "auto"              # auto = sestavit, když dist/ chybí nebo je starší než frontend/; always; never
command = "npm run build"

[profiles.preview]             # náhled nad kopií dat, nikdy nad produkcí
port = 8790
data = ".data/preview"
open_browser = false

[profiles.dev]                 # backend pro `npm run dev` (Vite proxuje /api sem)
port = 8740
data = ".data/production"
open_browser = false
frontend = "never"

[integrations]                 # prázdná hodnota = nenastaveno; tajemství (API klíče) sem nepatří, jdou přes proměnné prostředí
graphify_python = ""           # OPORA_GRAPHIFY_PYTHON – python s nainstalovaným graphify
