# Automatické review kódu (docs/oporahub-review-jobs.md). Přepis: OPORA_REVIEW_JOBS_CONFIG=<cesta k TOML>,
# zapnutí bez úpravy souboru: OPORA_REVIEW_JOBS=1. Hodnoty jsou deterministická pravidla, ne model.
enabled = false

[jobs]
finders = 3          # nezávislí hledači v čerstvém kontextu na jedno kolo
voters = 3           # oddělení ověřovatelé každého kandidáta
required_votes = 2   # kandidát se stane nálezem až s tolika potvrzeními
max_rounds = 3       # další kola po stropu rozhoduje člověk

[risk]
medium_lines = 200   # přidané + odebrané řádky celé změny PR
high_lines = 1000
medium_files = 10
high_files = 40
# Citlivé cesty: vždy aspoň jedno lidské schválení (úroveň aspoň medium).
sensitive = [
  ".github/workflows/**",
  ".github/actions/**",
  "**/auth/**",
  "**/*auth*.*",
  "**/migrations/**",
  "database/schema/**",
  "**/*secret*",
  "**/*.pem",
  "pyproject.toml",
  "package.json",
  "uv.lock",
  "package-lock.json",
]

[approvals]
low = 0
medium = 1
high = 2
sensitive_minimum = 1
# Číselná GitHub ID účtů agentů: jejich schválení se nikdy nepočítá jako lidské.
agent_account_ids = []

# Pravidla brány nad review kódu (docs/oporahub-review-jobs.md, „Pravidla brány“).
# Chybějící sekce pravidlo vypne; tento soubor zapíná všechna.
[security]
enabled = true
min_tier = "medium"  # bezpečnostní review pro hlavy s rizikem aspoň medium
# Bezpečnostně citlivé cesty (vždy bezpečnostní review); prázdné = risk.sensitive.
paths = [
  ".github/workflows/**",
  ".github/actions/**",
  "**/auth/**",
  "**/*auth*.*",
  "**/*secret*",
  "**/*token*",
  "**/*.pem",
  "backend/app/**",
  "backend/integrations/**",
  "database/schema/**",
  "**/migrations/**",
  "pyproject.toml",
  "package.json",
  "uv.lock",
  "package-lock.json",
]

[self_checks]
# Jména kontrol, které musí agent doložit pro aktuální hlavu (výsledek běhu nebo /self-checks).
required = ["tests", "build"]

[merge_queue]
enabled = true                 # ready jen pro hlavu postavenou na AKTUÁLNÍ hlavě cílové větve
required_checks = []           # názvy povinných CI kontrol (check run / status context) na hlavě PR
base_max_age_seconds = 900     # starší pozorování porovnání s cílovou větví se nepočítá
observe_interval_seconds = 60  # nejkratší odstup dvou čtení compare API pro jedno PR

[template]
# Sekce popisu PR podle .github/pull_request_template.md; chybějící = template_incomplete (čeká).
sections = ["Testing", "Risk", "Revert plan"]
