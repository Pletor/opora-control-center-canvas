# Vlastní prostředí hlasu XTTS-v2 pro Pletora (backend/agi_pletor/tts_xtts.py). Torch s CUDA má přes 2 GB, proto
# žije mimo hlavní projekt: `uv sync --project tools/xtts_server` (jednou), backend ho spouští sám jako podproces.
[project]
name = "opora-xtts-server"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
# torch < 2.9: od 2.9 chce torchaudio `torchcodec` s FFmpeg DLL (na Windows chybí); `six` chybí v deps coqui-tts 0.28.
dependencies = [
    "coqui-tts[cuda]>=0.27,<0.29",
    "six>=1.17.0",
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
