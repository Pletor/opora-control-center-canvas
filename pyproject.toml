[project]
name = "opora-control-center-canvas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pathspec>=0.12,<1",
    "tinycss2>=1.5,<2",
    "uvicorn>=0.30,<1",
]
[project.scripts]
opora = "tools.opora:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "tools", "database"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9"]
# Hlas Pletora (backend/pletor/tts.py). piper-tts je GPL-3: drží se mimo dependencies balíčku, lokálně se
# instaluje s výchozími skupinami; bez něj /api/pletor/tts vrací 503 a okno čte prohlížečovým hlasem.
tts = [
    "edge-tts>=7.2,<8",
    "piper-tts>=1.8,<2",
]
[tool.uv]
default-groups = ["dev", "tts"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend", "tools", "database"]
[tool.ruff]
line-length = 100
# Testy žijí vedle kódu; jejich styl nebyl nikdy lintován, ať baseline zůstane srovnatelná.
extend-exclude = ["**/test_*.py"]
