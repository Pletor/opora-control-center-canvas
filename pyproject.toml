[project]
name = "opora-control-center-canvas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pathspec>=0.12,<1",
    "uvicorn>=0.30,<1",
]
[project.scripts]
opora = "tools.opora:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "tools"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend", "tools"]
[tool.ruff]
line-length = 100
# Testy žijí vedle kódu; jejich styl nebyl nikdy lintován, ať baseline zůstane srovnatelná.
extend-exclude = ["**/test_*.py"]
